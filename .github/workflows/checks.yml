name: checks

on:
  push:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks dir . --no-banner --redact

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/core/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm run --silent lint
      - run: npx knip
      - run: npx jscpd
      - run: npx depcruise src test
      - run: npx depcruise src test --config .dependency-cruiser-stability.cjs
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run --silent test:cov
      - run: npx nestjs-doctor . --blocking error
      - run: npx stryker run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm run --silent lint
      - run: npx knip
      - run: npx jscpd
      - run: npx depcruise src
      - run: npx depcruise src --config .dependency-cruiser-stability.cjs
      - run: npx tsc -b --noEmit
      - run: npx react-doctor . --no-score --no-supply-chain --blocking warning -y
      - run: npm run --silent test:cov
      - run: npx stryker run

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ruff check
      - run: ./check-max-lines.sh
